<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHL Hot Leads Dashboard | Brightstar Solar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0e1a;
            --card: #141b2d;
            --border: #2d3748;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --cps: #3b82f6;
            --rqs: #10b981;
            --fire: #f59e0b;
            --danger: #ef4444;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #0a0e1a 100%);
            padding: 2rem;
            border-bottom: 1px solid var(--border);
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            color: var(--text-muted);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        
        .cps-color { color: var(--cps); }
        .rqs-color { color: var(--rqs); }
        .fire-color { color: var(--fire); }
        
        .lead-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .lead-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        .lead-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .lead-rank {
            background: var(--fire);
            color: #000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .lead-name {
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .lead-contact {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .scores {
            display: flex;
            gap: 2rem;
            margin: 1rem 0;
        }
        
        .score-box {
            text-align: center;
        }
        
        .score-value {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .score-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .quadrant {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 1rem 0;
        }
        
        .quadrant-priority {
            background: linear-gradient(135deg, #ef4444, #f59e0b);
        }
        
        .quadrant-fast {
            background: linear-gradient(135deg, #f59e0b, #eab308);
        }
        
        .quadrant-strategic {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }
        
        .quadrant-nurture {
            background: #475569;
        }
        
        .factors {
            margin: 1rem 0;
        }
        
        .factors h4 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }
        
        .factor-tag {
            display: inline-block;
            background: rgba(255,255,255,0.05);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 0.2rem;
        }
        
        .action-section {
            background: rgba(59, 130, 246, 0.1);
            border-left: 3px solid var(--cps);
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 0 8px 8px 0;
        }
        
        .action-section h4 {
            color: var(--cps);
            margin-bottom: 0.5rem;
        }
        
        .draft-message {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 8px;
            font-style: italic;
            margin: 0.5rem 0;
        }
        
        .talking-points {
            margin-top: 0.5rem;
        }
        
        .talking-points li {
            margin: 0.25rem 0;
            margin-left: 1.5rem;
        }
        
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }
        
        .last-updated {
            text-align: center;
            color: var(--text-muted);
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 Hot Leads Dashboard</h1>
        <p>Brightstar Solar • GHL Sales Assistant • Daily Top 10</p>
    </div>
    
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value cps-color" id="avgCps">--</div>
                <div class="stat-label">Avg CPS</div>
            </div>
            <div class="stat-card">
                <div class="stat-value rqs-color" id="avgRqs">--</div>
                <div class="stat-label">Avg RQS</div>
            </div>
            <div class="stat-card">
                <div class="stat-value fire-color" id="hotCount">--</div>
                <div class="stat-label">Priority Deals</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalScored">--</div>
                <div class="stat-label">Leads Scored</div>
            </div>
        </div>
        
        <div id="leadsContainer">
            <div class="loading">Loading hot leads...</div>
        </div>
        
        <div class="last-updated">
            Last updated: <span id="lastUpdate">--</span>
        </div>
    </div>
    
    <script>
        async function loadData() {
            try {
                const response = await fetch('latest_report.json?t=' + Date.now());
                const data = await response.json();
                
                // Update stats
                const leads = data.top_10_leads || [];
                const avgCps = leads.reduce((a, b) => a + b.cps, 0) / leads.length;
                const avgRqs = leads.reduce((a, b) => a + b.rqs, 0) / leads.length;
                const hotCount = leads.filter(l => l.quadrant.includes('PRIORITY')).length;
                
                document.getElementById('avgCps').textContent = avgCps.toFixed(1);
                document.getElementById('avgRqs').textContent = avgRqs.toFixed(1);
                document.getElementById('hotCount').textContent = hotCount;
                document.getElementById('totalScored').textContent = data.total_contacts_analyzed || '--';
                // Convert to PST
                document.getElementById('lastUpdate').textContent = new Date(data.generated_at).toLocaleString('en-US', { timeZone: 'America/Los_Angeles' });
                
                // Render leads
                const container = document.getElementById('leadsContainer');
                container.innerHTML = leads.map(lead => `
                    <div class="lead-card">
                        <div class="lead-header">
                            <div style="display: flex; align-items: center; gap: 1rem;">
                                <div class="lead-rank">${lead.rank}</div>
                                <div>
                                    <div class="lead-name">${lead.name}</div>
                                    <div class="lead-contact">${lead.phone} • ${lead.email}</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="scores">
                            <div class="score-box">
                                <div class="score-value cps-color">${lead.cps}</div>
                                <div class="score-label">CPS</div>
                            </div>
                            <div class="score-box">
                                <div class="score-value rqs-color">${lead.rqs}</div>
                                <div class="score-label">RQS</div>
                            </div>
                            <div class="score-box">
                                <div class="score-value" style="color: #f59e0b;">${lead.combined_score}</div>
                                <div class="score-label">Combined</div>
                            </div>
                        </div>
                        
                        <div class="quadrant ${getQuadrantClass(lead.quadrant)}">
                            ${lead.quadrant}
                        </div>
                        
                        <div class="factors">
                            <h4>Close Probability Factors</h4>
                            ${lead.cps_breakdown.map(f => `<span class="factor-tag">${f}</span>`).join('')}
                        </div>
                        
                        <div class="factors">
                            <h4>Revenue Quality Factors</h4>
                            ${lead.rqs_breakdown.map(f => `<span class="factor-tag">${f}</span>`).join('')}
                        </div>
                        
                        <div class="action-section">
                            <h4>🎯 ${lead.next_action}</h4>
                            <div class="draft-message">"${lead.draft_message}"</div>
                            <ul class="talking-points">
                                ${lead.talking_points.map(p => `<li>${p}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `).join('');
                
            } catch (e) {
                document.getElementById('leadsContainer').innerHTML = `
                    <div class="loading">
                        Error loading data. Make sure latest_report.json exists.<br>
                        ${e.message}
                    </div>
                `;
            }
        }
        
        function getQuadrantClass(quadrant) {
            if (quadrant.includes('PRIORITY')) return 'quadrant-priority';
            if (quadrant.includes('FAST')) return 'quadrant-fast';
            if (quadrant.includes('STRATEGIC')) return 'quadrant-strategic';
            return 'quadrant-nurture';
        }
        
        loadData();
        setInterval(loadData, 60000); // Refresh every minute
    </script>
</body>
</html>
